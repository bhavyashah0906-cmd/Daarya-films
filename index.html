<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daryaa Films</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }
    header {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    header video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Spotlight overlay */
    header::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(255,215,0,0.2) 0%, transparent 60%);
      animation: spotlightMove 10s infinite linear;
      pointer-events: none;
    }
    header .overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: gold;
      animation: fadeIn 2s ease-in-out;
    }
    header h1 {
      font-size: 4rem;
      text-shadow: 0 0 20px gold, 0 0 40px #000;
      animation: slideUp 2s ease-in-out;
    }
    header p {
      font-size: 1.5rem;
      margin-top: 10px;
      animation: fadeIn 3s ease-in-out;
    }
    header a {
      margin-top: 20px;
      padding: 12px 25px;
      background: gold;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: 0.3s;
      display: inline-block;
      animation: fadeIn 4s ease-in-out;
    }
    header a:hover {
      background: #fff;
      color: #000;
    }
    section {
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }
    h2 {
      color: gold;
      margin-bottom: 20px;
    }
